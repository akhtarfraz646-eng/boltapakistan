<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolta Pakistan</title>
<style>
body{font-family:sans-serif;text-align:center;padding:20px;background:#f5f5f5}
.container{max-width:600px;margin:auto;background:white;padding:20px;border-radius:15px;box-shadow:0 0 10px #ccc}
textarea{width:100%;height:120px;font-size:18px;padding:10px}
button{padding:12px 25px;font-size:18px;background:#0d6efd;color:white;border:none;border-radius:8px;margin-top:10px;cursor:pointer}
audio{margin-top:20px;width:100%}
img{width:80px}
</style>
</head>
<body>
<div class="container">
<img src="logo.png">
<h2>Bolta Pakistan</h2>
<textarea id="text" placeholder="Yahan Urdu me likhen..."></textarea><br>
<button onclick="speak()">Bolo</button>
<audio id="audio" controls style="display:none"></audio>
<p id="status"></p>
</div>
<script>
async function speak(){
 let t=document.getElementById("text").value;
 if(!t){alert("Text likhen");return;}
 document.getElementById("status").innerText="Bana raha hai...";
 let res=await fetch("/api/speak",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({text:t})
 });
 if(!res.ok){document.getElementById("status").innerText="Error!";return;}
 let blob=await res.blob();
 let url=URL.createObjectURL(blob);
 let a=document.getElementById("audio");
 a.src=url; a.style.display="block"; a.play();
 document.getElementById("status").innerText="Taiyaar hai!";
}
</script>
</body>
</html>
